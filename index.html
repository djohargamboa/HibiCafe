/* ============================================================
   METRICS ENGINE (shared by Dashboard + Reports)
   ============================================================ */
function computeMetrics(orders){
  const completed = orders.filter(o=>!p1IsCancelled(o));
  const cancelled = orders.filter(p1IsCancelled);
  const totalSales = completed.reduce((s,o)=>s+o.total,0);
  const totalTx = completed.length;
  let cups=0, foodItems=0;
  const cupBySize = {'Hot 12oz':0,'Iced 16oz':0,'Iced 20oz':0};
  const productAgg = {}; // name -> {qty, sales, sizes:{}}
  const pmAgg = {}; // method -> {count, sales}
  const sourceAgg = {'Walk-in':{count:0,sales:0,items:0,cups:0,discounts:0},'GrabFood':{count:0,sales:0,items:0,cups:0,discounts:0}};
  completed.forEach(o=>{
    // Payment breakdown is based on the actual money received.
    // For Cash + GCash, split the order total between the two payment methods
    // instead of creating a separate reporting category.
    if(o.paymentMethod==='Cash + GCash'){
      const cashAmt=Number(o.cashAmount)||0;
      const gcashAmt=Number(o.gcashAmount)||0;
      if(cashAmt>0){
        pmAgg['Cash'] = pmAgg['Cash'] || {count:0,sales:0};
        pmAgg['Cash'].count++;
        pmAgg['Cash'].sales += cashAmt;
      }
      if(gcashAmt>0){
        pmAgg['GCash'] = pmAgg['GCash'] || {count:0,sales:0};
        pmAgg['GCash'].count++;
        pmAgg['GCash'].sales += gcashAmt;
      }
    } else {
      pmAgg[o.paymentMethod] = pmAgg[o.paymentMethod] || {count:0,sales:0};
      pmAgg[o.paymentMethod].count++;
      pmAgg[o.paymentMethod].sales += o.total;
    }
    const src=o.source||'Walk-in'; sourceAgg[src]=sourceAgg[src]||{count:0,sales:0,items:0,cups:0,discounts:0}; sourceAgg[src].count++; sourceAgg[src].sales+=o.total; sourceAgg[src].discounts+=Number(o.discountAmount)||0; sourceAgg[src].items+=o.items.reduce((s,i)=>s+i.qty,0); sourceAgg[src].cups+=o.items.filter(i=>i.isDrink).reduce((s,i)=>s+i.qty,0);
    o.items.forEach(it=>{
      if(it.isDrink){
        cups += it.qty;
        if(it.size && cupBySize.hasOwnProperty(it.size)) cupBySize[it.size]+=it.qty;
      } else {
        foodItems += it.qty;
      }
      productAgg[it.name] = productAgg[it.name] || {qty:0, sales:0, isDrink:it.isDrink, sizes:{}};
      productAgg[it.name].qty += it.qty;
      productAgg[it.name].sales += it.lineTotal;
      if(it.size){
        productAgg[it.name].sizes[it.size] = (productAgg[it.name].sizes[it.size]||0) + it.qty;
      }
      // add-on revenue folded into product sales already via lineTotal
    });
  });
  const avgOrder = totalTx ? totalSales/totalTx : 0;
  const products = Object.entries(productAgg).map(([name,v])=>({name,...v}));
  products.sort((a,b)=>b.qty-a.qty);
  const bestByQty = products[0] || null;
  const bestByRevenue = [...products].sort((a,b)=>b.sales-a.sales)[0] || null;
  const bestFood = [...products].filter(p=>!p.isDrink).sort((a,b)=>b.qty-a.qty)[0] || null;
  const leastSelling = products.length ? [...products].sort((a,b)=>a.qty-b.qty)[0] : null;
  const popularSize = Object.entries(cupBySize).sort((a,b)=>b[1]-a[1])[0];
  const cancelledAmount = cancelled.reduce((s,o)=>s+o.total,0);
  return {totalSales,totalTx,cups,foodItems,avgOrder,cupBySize,products,pmAgg,sourceAgg,bestByQty,bestByRevenue,bestFood,leastSelling,popularSize,cancelled,cancelledAmount};
}

function renderStaffDashboard(){
  const dateKey=businessDayKey();

  const preparing=filteredOrders({mode:'today',status:'Preparing',source:'all'}).filter(o=>!p1IsCancelled(o));
  const cups=operationalOrders.reduce((total,o)=>total+(o.items||[]).filter(item=>item.isDrink).reduce((n,item)=>n+(Number(item.qty)||0),0),0);
  const currentShift=openShiftForDate(dateKey);
  const live=currentShift?shiftFinancialSummary(currentShift):null;

function monthDateRange(ym){
  const [y,m]=ym.split('-').map(Number);
  const last=new Date(Date.UTC(y,m,0)).getUTCDate();
  return {start:`${ym}-01`,end:`${ym}-${String(last).padStart(2,'0')}`,days:last};
}
function formatMonthLabel(ym){
  const [y,m]=ym.split('-').map(Number);
  return new Date(Date.UTC(y,m-1,1)).toLocaleDateString('en-PH',{timeZone:'Asia/Manila',month:'long',year:'numeric'});
}
function renderMonthlyPerformance(){
  if(!isSuperuser()) return;
  const el=document.getElementById('monthly-performance-content');
  const ym=monthlyPerformanceMonth || todayStr().slice(0,7);
  const {start,end,days}=monthDateRange(ym);
  const monthOrders=ORDERS.filter(o=>o.date>=start && o.date<=end);
  const monthExpenses=EXPENSES.filter(x=>x.date>=start && x.date<=end && x.status!=='Voided');
  const monthOwnerExpenses=OWNER_EXPENSES.filter(x=>x.date>=start && x.date<=end && x.status!=='Voided');
  const completed=monthOrders;
  const m=computeMetrics(completed,p1Refunds(start,end));
  const expenseTotal=monthExpenses.reduce((sum,x)=>sum+Number(x.amount||0),0);
  const opexTotal=monthOwnerExpenses.reduce((sum,x)=>sum+Number(x.amount||0),0);
  const totalCash=m.pmAgg['Cash']?.sales||0;
  const totalGcash=m.pmAgg['GCash']?.sales||0;
  const totalGrab=m.pmAgg['GrabFood']?.sales||0;
  const netAfterDailyExpenses=m.estimatedProceeds-expenseTotal;
  const netAfterAllExpenses=netAfterDailyExpenses-opexTotal;
  const activeDays=new Set(completed.filter(o=>!p1IsCancelled(o)).map(o=>o.date)).size;
  const dailyRows=[];
  for(let d=1;d<=days;d++){
    const dateKey=`${ym}-${String(d).padStart(2,'0')}`;
    const dayOrders=ORDERS.filter(o=>o.date===dateKey);
    const dayCompleted=dayOrders;
    const dm=computeMetrics(dayCompleted,p1Refunds(dateKey));
    const dayExpenses=monthExpenses.filter(x=>x.date===dateKey);
    const exp=dayExpenses.reduce((sum,x)=>sum+Number(x.amount||0),0);
    const dayOpex=monthOwnerExpenses.filter(x=>x.date===dateKey);
    const opex=dayOpex.reduce((sum,x)=>sum+Number(x.amount||0),0);
    const eod=EOD[dateKey]||{};
    const cashSales=dm.pmAgg['Cash']?.sales||0;
    const gcashSales=dm.pmAgg['GCash']?.sales||0;
    const grabSales=dm.pmAgg['GrabFood']?.sales||0;
    const opening=eod.opening!=null ? Number(eod.opening) : Number(openingCashForDate(dateKey)||0);
    const cashIn=Number(eod.cashIn||0);
    const cashOut=Number(eod.cashOut||0);
    const expected=eod.expected!=null ? Number(eod.expected) : opening+cashIn+cashSales-cashOut-exp;
    const actual=eod.actual!=null ? Number(eod.actual) : null;
    const variance=actual!=null ? actual-expected : null;
    dailyRows.push({dateKey,dayOrders,dm,exp,opex,cashSales,gcashSales,grabSales,opening,cashIn,cashOut,expected,actual,variance});
  }
  const performanceCash=dailyRows.reduce((sum,r)=>sum+Number(r.cashSales||0),0);
  const performanceGcash=dailyRows.reduce((sum,r)=>sum+Number(r.gcashSales||0),0);
  const performanceGrab=dailyRows.reduce((sum,r)=>sum+Number(r.grabSales||0),0);
  const performanceExpenses=dailyRows.reduce((sum,r)=>sum+Number(r.exp||0),0);
  const performanceCashOpex=monthOwnerExpenses.filter(x=>(x.paymentMethod||'Cash')==='Cash').reduce((sum,x)=>sum+Number(x.amount||0),0);
  const performanceGcashOpex=monthOwnerExpenses.filter(x=>(x.paymentMethod||'Cash')==='GCash').reduce((sum,x)=>sum+Number(x.amount||0),0);
  const performanceBankOpex=monthOwnerExpenses.filter(x=>(x.paymentMethod||'Cash')==='Bank Transfer').reduce((sum,x)=>sum+Number(x.amount||0),0);
  const performanceCurrentCash=performanceCash-performanceExpenses-performanceCashOpex;
  const performanceCurrentGcash=performanceGcash-performanceGcashOpex;
  const performanceCurrentBank=performanceGrab-m.estimatedFees-performanceBankOpex;
  const moneyFmt=(n)=>PESO(Number(n)||0);
  el.innerHTML=`
    <div class="page-title">
      <div><h1>Monthly Performance</h1><div class="psub">Daily business summary for ${esc(formatMonthLabel(ym))}</div></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <label style="font-size:12px;color:var(--text-dim);font-weight:700;">Month</label>
        <input type="month" id="monthly-performance-month" value="${escAttr(ym)}">
      </div>
    </div>

    <section class="month-total-panel" aria-label="Month total">
      <div class="month-total-heading">
        <div><div class="month-total-eyebrow">MONTH TOTAL</div><h2>${esc(formatMonthLabel(ym))}</h2><p>All recorded activity for the selected month</p></div>
        <div class="month-total-net"><span>Estimated Balance</span><strong>${moneyFmt(netAfterAllExpenses)}</strong><small>After Grab deductions, daily expenses &amp; OPEX</small></div>
      </div>
      <div class="month-total-metrics">
        <div><span>Total Sales</span><strong>${moneyFmt(m.totalSales)}</strong></div>
        <div><span>Cups Sold</span><strong>${m.cups}</strong></div>
        <div><span>Cash Sales</span><strong>${moneyFmt(totalCash)}</strong></div>
        <div><span>GCash Sales</span><strong>${moneyFmt(totalGcash)}</strong></div>
        <div><span>GrabFood Sales</span><strong>${moneyFmt(totalGrab)}</strong></div>
        <div><span>Daily Expenses</span><strong>${moneyFmt(expenseTotal)}</strong></div>
        <div><span>OPEX</span><strong>${moneyFmt(opexTotal)}</strong></div>
        <div><span>Days with Sales</span><strong>${activeDays}</strong></div>
      </div>
      <div class="month-total-averages"><span>Average per day with sales</span><span><strong>${activeDays ? (m.cups/activeDays).toFixed(1) : '—'}</strong> cups</span><span><strong>${activeDays ? moneyFmt(m.totalSales/activeDays) : '—'}</strong> sales</span></div>
    </section>

    <div class="stat-grid" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px;">
      <div class="stat-card"><div class="slabel">Cash Sales less Expenses</div><div class="sval" style="font-size:22px;">${moneyFmt(performanceCurrentCash)}</div></div>
      <div class="stat-card"><div class="slabel">GCash Sales less Expenses</div><div class="sval" style="font-size:22px;">${moneyFmt(performanceCurrentGcash)}</div></div>
      <div class="stat-card"><div class="slabel">Est. Grab Proceeds after Bank OPEX</div><div class="sval" style="font-size:22px;">${moneyFmt(performanceCurrentBank)}</div></div>
    </div>

    <details class="card" style="padding:0;margin-top:16px;overflow-x:auto;" open>
      <summary style="cursor:pointer;padding:18px 20px;list-style-position:inside;">
        <span class="section-title" style="display:inline;margin:0;">Daily Summary</span>
        <span style="display:block;font-size:12px;color:var(--text-dim);margin:5px 0 0 22px;">One row per calendar day. Estimated balance = Net sales − estimated Grab fees − daily expenses − OPEX.</span>
      </summary>
      <div style="padding:0 20px 18px;">
      <table style="min-width:850px;">
        <thead><tr>
          <th>Date</th><th class="num">Est. Balance</th><th class="num">Cups</th><th class="num">Total Sales</th>
          <th class="num">Cash</th><th class="num">GCash</th><th class="num">Grab</th><th class="num">Expenses</th><th class="num">OPEX</th>
        </tr></thead>
        <tbody>
          ${dailyRows.map(r=>{
            const hasActivity=r.dm.totalTx||r.dm.refundTotal||r.opex||r.exp||r.opening||r.cashIn||r.cashOut||r.actual!=null;
            return `<tr style="${hasActivity?'':'opacity:.52;'}">
              <td><strong>${r.dateKey}</strong></td>
              <td class="num" style="font-weight:700;">${moneyFmt(r.dm.estimatedProceeds-r.exp-r.opex)}</td>
              <td class="num">${r.dm.cups||0}</td>
              <td class="num" style="font-weight:700;">${moneyFmt(r.dm.totalSales)}</td>
              <td class="num">${moneyFmt(r.cashSales)}</td>
              <td class="num">${moneyFmt(r.gcashSales)}</td>
              <td class="num">${moneyFmt(r.grabSales)}</td>
              <td class="num">${moneyFmt(r.exp)}</td>
              <td class="num">${moneyFmt(r.opex)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    </details>
  `;
  el.querySelector('#monthly-performance-month').onchange=e=>{
    monthlyPerformanceMonth=e.target.value || todayStr().slice(0,7);
    renderMonthlyPerformance();
  };
}

function ordersForReportFilter(){
  return ORDERS.filter(o=>{
    if(reportsFilter.mode==='today') return o.date===businessDayKey();
    if(reportsFilter.mode==='date') return o.date===reportsFilter.date;
    if(reportsFilter.mode==='range') return o.date>=reportsFilter.start && o.date<=reportsFilter.end;
    if(reportsFilter.mode==='month'){
      const ym = todayStr().slice(0,7);
      return o.date.slice(0,7)===ym;
    }
    return true;
  });
}
function getPreviousDate(dateStr){ return shiftCalendarDate(dateStr,-1); }

function openingCashForDate(dateStr){
  const firstShift=shiftsForDate(dateStr).sort((a,b)=>a.shiftNumber-b.shiftNumber)[0];
  if(firstShift) return Number(firstShift.openingCash)||0;
  const previous = EOD[getPreviousDate(dateStr)] || {};
  return previous.actual ?? 0;
}

let reportsView = 'daily';
function renderReports(){
  if(!can('reports')) return;
  if(!isSuperuser()){
    reportsView='daily';
    const today=businessDayKey();
    reportsFilter={mode:'today',date:today,start:today,end:today};
  }
  const monthly=reportsView==='monthly';
  document.querySelectorAll('#report-view-switcher [data-report-view]').forEach(button=>{
    const selected=button.dataset.reportView===reportsView;
    button.style.display=button.dataset.reportView==='monthly' && !isSuperuser()?'none':'';
    button.classList.toggle('is-selected',selected);
    button.setAttribute('aria-pressed',String(selected));
    button.onclick=()=>{
      if(button.dataset.reportView==='monthly' && !isSuperuser()) return;
      reportsView=button.dataset.reportView;
      renderReports();
      replayMotion(document.getElementById(reportsView==='monthly'?'monthly-performance-content':'reports-content'));
    };
  });
  document.getElementById('reports-content').style.display=monthly?'none':'';
  document.getElementById('monthly-performance-content').style.display=monthly?'':'none';
  if(!isSuperuser()) document.getElementById('monthly-performance-content').replaceChildren();
  if(monthly){ renderMonthlyPerformance(); return; }
  const orders = ordersForReportFilter();
  const m = computeMetrics(orders,p1Refunds(...p1Range(reportsFilter)));
  [m.reportStart,m.reportEnd]=p1Range(reportsFilter);
  const expenses = filteredExpenses(reportsFilter).filter(x=>x.status!=='Voided');
  const expenseTotal = expenses.reduce((s,x)=>s+Number(x.amount||0),0);
  const reportOpex=OWNER_EXPENSES.filter(x=>matchesPeriod(x.date,reportsFilter)&&x.status!=='Voided').reduce((n,x)=>n+x.amount,0);
  m.opex=reportOpex;
  const netSales = m.estimatedProceeds - expenseTotal - reportOpex;
  const el = document.getElementById('reports-content');
  const rangeLabel = reportsFilter.mode==='today' ? 'Today' : reportsFilter.mode==='date' ? reportsFilter.date : reportsFilter.mode==='month' ? 'This Month' : `${reportsFilter.start} → ${reportsFilter.end}`;
  const selectedEodDate = reportsFilter.mode==='date' ? reportsFilter.date : businessDayKey();
  const eod = (reportsFilter.mode==='today'||reportsFilter.mode==='date') ? (EOD[selectedEodDate] || {}) : {};
  const eodOpenShift = openShiftForDate(selectedEodDate);
  const openingCash = openingCashForDate(selectedEodDate);
  const drawerTotals = cashMovementTotals(selectedEodDate);

  el.innerHTML = `
    <div class="page-title">
      <div><h1>Daily Reports</h1><div class="psub">Showing: ${esc(rangeLabel)}</div></div>
      <button class="btn btn-secondary" id="export-report-btn">⬇ Export Excel</button>
    </div>
    <div class="filter-bar">
      ${isSuperuser()?`<button class="filter-btn ${reportsFilter.mode==='today'?'active':''}" data-rm="today">Today</button>
      <button class="filter-btn ${reportsFilter.mode==='month'?'active':''}" data-rm="month">This Month</button>
      <span style="color:var(--text-dim);font-size:12px;">or pick date:</span>
      <input type="date" id="report-date" value="${reportsFilter.mode==='date'?reportsFilter.date:todayStr()}">
      <span style="color:var(--text-dim);font-size:12px;">or range:</span>
      <input type="date" id="report-start" value="${reportsFilter.start}">
      <span style="color:var(--text-dim);">–</span>
      <input type="date" id="report-end" value="${reportsFilter.end}">
      <button class="filter-btn" id="report-apply-range">Apply Range</button>
      <button class="filter-btn" id="reports-prev">‹ PREV</button>
      <button class="filter-btn" id="reports-next" ${shiftDateKey(reportsFilter.mode==='date'?reportsFilter.date:todayStr(),1)<=todayStr()?'':'disabled'}>NEXT ›</button>`:`<button class="filter-btn active" type="button">Today · ${esc(businessDayKey())}</button><span style="color:var(--text-dim);font-size:12px;">Current business day reconciliation</span>`}
    </div>

    <div class="stat-grid">
      <div class="stat-card accent"><div class="slabel">Total Sales</div><div class="sval">${PESO(m.totalSales)}</div></div>
      <div class="stat-card"><div class="slabel">Transactions</div><div class="sval">${m.totalTx}</div></div>
      <div class="stat-card"><div class="slabel">Drinks / Cups Sold</div><div class="sval">${m.cups}</div></div>
      <div class="stat-card"><div class="slabel">Food Items Sold</div><div class="sval">${m.foodItems}</div></div>
    </div>
    <div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-top:-6px;">
      <div class="stat-card"><div class="slabel">Average Order Value</div><div class="sval" style="font-size:22px;">${PESO(m.avgOrder)}</div></div>
      <div class="stat-card"><div class="slabel">Total Expenses</div><div class="sval" style="font-size:22px;color:var(--rust);">${PESO(expenseTotal)}</div></div>
      <div class="stat-card"><div class="slabel">Estimated Balance (after fees & expenses)</div><div class="sval" style="font-size:22px;">${PESO(netSales)}</div></div>
    </div>

    <div class="two-col">
      <div class="card" style="padding:18px 20px;">
        <div class="section-title">Payment Breakdown</div>
        <table>
          <thead><tr><th>Method</th><th class="num">Transactions</th><th class="num">Sales</th></tr></thead>
          <tbody>
            ${['Cash','GCash','GrabFood'].map(pm=>`<tr><td>${pm}</td><td class="num">${m.pmAgg[pm]?.count||0}</td><td class="num">${PESO(m.pmAgg[pm]?.sales||0)}</td></tr>`).join('')}
            <tr style="font-weight:700;"><td>Total</td><td class="num">${m.totalTx}</td><td class="num">${PESO(m.totalSales)}</td></tr>
          </tbody>
        </table>
      </div>
      <div class="card" style="padding:18px 20px;">
        <div class="section-title">Cup Breakdown</div>
        <table>
          <thead><tr><th>Cup Size</th><th class="num">Cups Sold</th></tr></thead>
          <tbody>
            ${CUP_SIZES.map(s=>`<tr><td>${s}</td><td class="num">${m.cupBySize[s]}</td></tr>`).join('')}
            <tr style="font-weight:700;"><td>Total Cups Sold</td><td class="num">${m.cups}</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card" style="padding:18px 20px;margin-top:16px;overflow-x:auto;${isSuperuser()?'':'display:none;'}">
      <div class="section-title">Product Performance</div>
      <table>
        <thead><tr><th>Product</th><th class="num">Hot 12oz</th><th class="num">Iced 16oz</th><th class="num">Iced 20oz</th><th class="num">Qty Sold</th><th class="num">Total Sales</th></tr></thead>
        <tbody>
          ${m.products.length ? m.products.map(p=>`
            <tr>
              <td>${esc(p.name)}${p.isDrink?'':' <span class="badge-inactive">FOOD</span>'}</td>
              <td class="num">${p.sizes['Hot 12oz']||''}</td>
              <td class="num">${p.sizes['Iced 16oz']||''}</td>
              <td class="num">${p.sizes['Iced 20oz']||''}</td>
              <td class="num" style="font-weight:700;">${p.qty}</td>
              <td class="num">${PESO(p.sales)}</td>
            </tr>`).join('') : `<tr><td colspan="6"><div class="empty-state">No sales in this period.</div></td></tr>`}
        </tbody>
      </table>
    </div>

    <div class="card" style="padding:18px 20px;margin-top:16px;">
      <div class="section-title">Best-Selling Products</div>
      <div class="stat-grid">
        <div><div style="font-size:11px;color:var(--text-dim);font-weight:700;text-transform:uppercase;">Best by Quantity</div><div style="font-weight:700;margin-top:4px;">${m.bestByQty?esc(m.bestByQty.name)+' ('+m.bestByQty.qty+')':'—'}</div></div>
        <div><div style="font-size:11px;color:var(--text-dim);font-weight:700;text-transform:uppercase;">Best by Revenue</div><div style="font-weight:700;margin-top:4px;">${m.bestByRevenue?esc(m.bestByRevenue.name)+' ('+PESO(m.bestByRevenue.sales)+')':'—'}</div></div>
        <div><div style="font-size:11px;color:var(--text-dim);font-weight:700;text-transform:uppercase;">Best Food Item</div><div style="font-weight:700;margin-top:4px;">${m.bestFood?esc(m.bestFood.name):'—'}</div></div>
        <div><div style="font-size:11px;color:var(--text-dim);font-weight:700;text-transform:uppercase;">Most Popular Cup Size</div><div style="font-weight:700;margin-top:4px;">${m.popularSize&&m.popularSize[1]>0?esc(m.popularSize[0]):'—'}</div></div>
        <div><div style="font-size:11px;color:var(--text-dim);font-weight:700;text-transform:uppercase;">Least-Selling Product</div><div style="font-weight:700;margin-top:4px;">${m.leastSelling?esc(m.leastSelling.name)+' ('+m.leastSelling.qty+')':'—'}</div></div>
      </div>
    </div>

    <div class="card" style="padding:18px 20px;margin-top:16px;">
      <div class="section-title">Cancelled Orders</div>
      <div class="sumrow"><span>Number of Cancelled Orders</span><span>${m.cancelled.length}</span></div>
      <div class="sumrow"><span>Cancelled Order Amount</span><span>${PESO(m.cancelledAmount)}</span></div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:6px;">Excluded from all sales totals above.</div>
    </div>

    <div class="card" style="padding:18px 20px;margin-top:16px;overflow-x:auto;">
      <div class="page-title" style="margin-bottom:10px;">
        <div class="section-title" style="margin:0;">Expenses</div>
        <span style="font-weight:700;">${PESO(expenseTotal)}</span>
      </div>
      <table>
        <thead><tr><th>Date</th><th>Note</th><th class="num">Amount</th><th>Cashier</th></tr></thead>
        <tbody>
          ${expenses.length ? expenses.map(x=>`
            <tr><td>${x.date}</td><td>${esc(x.note)}</td><td class="num">${PESO(x.amount)}</td><td>${esc(x.cashier)}</td></tr>
          `).join('') : `<tr><td colspan="4"><div class="empty-state">No expenses logged in this period.</div></td></tr>`}
        </tbody>
      </table>
    </div>

    <div class="card" style="padding:18px 20px;margin-top:16px;">
      <div class="section-title">Cash Drawer Movements</div>
      <div class="sumrow"><span>Cash In</span><span>${PESO(drawerTotals.in)}</span></div>
      <div class="sumrow"><span>Cash Out</span><span>−${PESO(drawerTotals.out)}</span></div>
    </div>

    <div class="card" style="padding:18px 20px;margin-top:16px;">
      <div class="section-title">End-of-Day Cash Reconciliation ${reportsFilter.mode!=='date'&&reportsFilter.mode!=='today'?'<span style="font-weight:400;font-size:12px;color:var(--text-dim);">(pick a single date to edit)</span>':''}</div>
      <div class="two-col">
        <div class="field"><label>Opening Cash</label><input type="number" id="eod-opening" value="${openingCash}" disabled></div>
        <div class="field"><label>Actual Cash Counted</label><input type="number" id="eod-actual" value="${eod.actual??lastShiftActualForDate(selectedEodDate)??''}" ${reportsFilter.mode==='range'||reportsFilter.mode==='month'||eod.locked||!!eodOpenShift?'disabled':''}></div>
      </div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:-6px;margin-bottom:10px;">Expenses logged for this day are assumed paid out of the cash drawer and are subtracted below.</div>
      <div id="eod-calc"></div>
      <div class="field" style="margin-top:12px;"><label>Cash Variance Reason</label><textarea id="eod-variance-reason" rows="2" style="min-height:48px;resize:vertical;" placeholder="Required when actual cash differs from expected cash" ${eod.locked?'disabled':''}>${esc(eod.varianceReason||'')}</textarea></div>
      <div style="font-size:12px;color:var(--text-dim);margin-top:8px;">${eod.locked?'🔒 This day is reconciled and locked.':eodOpenShift?`⚠ ${esc(eodOpenShift.shiftName)} is still open. Close the shift before EOD reconciliation.`:'A reason is required if there is a cash variance.'}</div>
      ${eod.locked && isSuperuser()?`<button class="btn btn-secondary" id="eod-unlock" style="margin-top:10px;">🔓 Unlock Reconciled Day</button>`:''}
      <button class="btn btn-primary" id="eod-save" style="margin-top:10px;" ${reportsFilter.mode==='range'||reportsFilter.mode==='month'||eod.locked||!!eodOpenShift?'disabled':''}>${eod.locked?'🔒 Reconciled & Locked':eodOpenShift?'Close Shift Before EOD':'Save Reconciliation'}</button>
    </div>
  `;

  // wire filter bar
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ reportsFilter.mode=b.dataset.rm; renderReports(); });
  el.querySelector('#report-date')?.addEventListener('change',(e)=>{ reportsFilter.mode='date'; reportsFilter.date=e.target.value; renderReports(); });
  el.querySelector('#report-start')?.addEventListener('change',(e)=>{ reportsFilter.start=e.target.value; });
  el.querySelector('#report-end')?.addEventListener('change',(e)=>{ reportsFilter.end=e.target.value; });
  el.querySelector('#reports-prev')?.addEventListener('click',()=>{const current=reportsFilter.mode==='date'?reportsFilter.date:todayStr();reportsFilter.mode='date';reportsFilter.date=shiftDateKey(current,-1);renderReports();});
  el.querySelector('#reports-next')?.addEventListener('click',()=>{const current=reportsFilter.mode==='date'?reportsFilter.date:todayStr();const n=shiftDateKey(current,1);if(n<=businessDayKey()){reportsFilter.mode='date';reportsFilter.date=n;renderReports();}});
  el.querySelector('#report-apply-range')?.addEventListener('click',()=>{ reportsFilter.mode='range'; renderReports(); });
  el.querySelector('#export-report-btn').onclick = ()=> exportReportExcel(m, rangeLabel, orders, expenses, expenseTotal, netSales, eod);
  const unlockBtn=el.querySelector('#eod-unlock');
  if(unlockBtn) unlockBtn.onclick=async()=>{
    if(!isSuperuser()) return;
    if(!confirm(`Unlock reconciled day ${selectedEodDate}?`)) return;
    const reason=requireActionReason(`unlocking reconciled day ${selectedEodDate}`);
    if(!reason) return;
    const unlocked={...(EOD[selectedEodDate]||{}),locked:false,unlockedAt:new Date().toISOString(),unlockedBy:(CURRENT_PROFILE?.display_name||CURRENT_PROFILE?.username||'Superuser')};
    try{ await saveEodRecord(selectedEodDate,unlocked); EOD[selectedEodDate]=unlocked; }
    catch(e){ toast('Day was NOT unlocked: '+(e?.message||'database error')); return; }
    await writeAudit('UNLOCK_RECONCILED_DAY','eod',selectedEodDate,reason,{date:selectedEodDate});
    toast(`${selectedEodDate} unlocked.`);
    renderReports();
  };

  function recalcEod(){
    const opening = parseFloat(document.getElementById('eod-opening').value)||0;
    const actual = document.getElementById('eod-actual').value;
    const cashSales = m.pmAgg['Cash']?.sales || 0;
    const gcashSales = m.pmAgg['GCash']?.sales || 0;
    const expected = opening + drawerTotals.in + cashSales - drawerTotals.out - expenseTotal;
    const calcDiv = document.getElementById('eod-calc');
    if(actual===''){
      calcDiv.innerHTML = `<div class="sumrow" style="margin-top:10px;"><span>Cash Sales</span><span>${PESO(cashSales)}</span></div>
      <div class="sumrow"><span>Cash In</span><span>+${PESO(drawerTotals.in)}</span></div>
      <div class="sumrow"><span>Cash Out</span><span>−${PESO(drawerTotals.out)}</span></div>
      <div class="sumrow"><span>Less: Expenses</span><span>−${PESO(expenseTotal)}</span></div>
      <div class="sumrow"><span>Expected Cash</span><span>${PESO(expected)}</span></div>
      <div class="sumrow"><span>GCash Sales (separate)</span><span>${PESO(gcashSales)}</span></div>`;
      return;
    }
    const variance = parseFloat(actual) - expected;
    const status = Math.abs(variance) < 0.005 ? 'Balanced' : variance>0 ? 'Over' : 'Short';
    calcDiv.innerHTML = `
      <div class="sumrow" style="margin-top:10px;"><span>Cash Sales</span><span>${PESO(cashSales)}</span></div>
      <div class="sumrow"><span>Less: Expenses</span><span>−${PESO(expenseTotal)}</span></div>
      <div class="sumrow"><span>Expected Cash</span><span>${PESO(expected)}</span></div>
      <div class="change-row ${variance<0?'negative':variance>0?'':'positive'}">
        <span>${status}${variance!==0?' by':''}</span><span>${variance!==0?PESO(Math.abs(variance)):''}</span>
      </div>
      <div class="sumrow" style="margin-top:8px;"><span>GCash Sales (separate)</span><span>${PESO(gcashSales)}</span></div>`;
  }
  el.querySelector('#eod-actual').addEventListener('input', recalcEod);
  const saveBtn = el.querySelector('#eod-save');
  if(saveBtn && !saveBtn.disabled){
    saveBtn.onclick = async ()=>{
      const opening = parseFloat(document.getElementById('eod-opening').value)||0;
      const actualValue = document.getElementById('eod-actual').value;
      const actual = actualValue==='' ? null : parseFloat(actualValue);
      const cashSales = m.pmAgg['Cash']?.sales || 0;
      const gcashSales = m.pmAgg['GCash']?.sales || 0;
      const expected = opening + drawerTotals.in + cashSales - drawerTotals.out - expenseTotal;
      const variance = actual===null ? null : actual - expected;
      const varianceReason=(document.getElementById('eod-variance-reason')?.value||'').trim();
      const dateKey = selectedEodDate || (reportsFilter.mode==='date' ? reportsFilter.date : todayStr());
      if(openShiftForDate(dateKey)){ toast('Close the open shift before saving EOD reconciliation.'); return; }
      if(!isSuperuser() && dateKey!==businessDayKey()){ toast('Past-date reconciliation is not allowed.'); return; }
      if(isDateLocked(dateKey) && !isSuperuser()){ toast(`${dateKey} is already reconciled and locked.`); return; }
      if(actual===null){ toast('Enter Actual Cash Counted before saving reconciliation.'); return; }
      if(variance!==null && Math.abs(variance)>=0.005 && !varianceReason){ toast('Please enter a reason for the cash variance.'); return; }
      const reconciliation={...(EOD[dateKey]||{}),opening,actual,expected,variance,totalCashSales:cashSales,cashIn:drawerTotals.in,cashOut:drawerTotals.out,totalGcashSales:gcashSales,totalExpenses:expenseTotal,varianceReason,locked:true,reconciledAt:new Date().toISOString(),reconciledBy:(CURRENT_PROFILE?.display_name||CURRENT_PROFILE?.username||'Staff')};
      try{ await saveEodRecord(dateKey,reconciliation); EOD[dateKey]=reconciliation; }
      catch(e){ toast('Reconciliation was NOT saved: '+(e?.message||'database error')); return; }
      await writeAudit('reconcile_day','eod',dateKey,varianceReason,{opening,actual,expected,variance,cashIn:drawerTotals.in,cashOut:drawerTotals.out,totalCashSales:cashSales,totalGcashSales:gcashSales,totalExpenses:expenseTotal});
      try{
        const attachment = await exportReportExcel(m, rangeLabel, orders, expenses, expenseTotal, netSales, reconciliation, {download:false});
        const emailReport = buildDailyEmailReport(dateKey, rangeLabel, m, orders, expenses, expenseTotal, netSales, reconciliation);
        await sendDailyReportEmail(emailReport, attachment);
        toast('Cash reconciliation saved and daily report emailed.');
      }catch(err){
        console.error('Daily report email failed:', err);
        toast('Cash reconciliation saved, but email failed: ' + (err.message || err));
      }
      renderReports();
    };
  }
  recalcEod();
}

/* ---------- Excel export ---------- */
function excelSafeFilenameDate(){
  const d = (reportsFilter.mode==='date' ? reportsFilter.date : reportsFilter.mode==='today' ? todayStr() : todayStr());
  return d || todayStr();
}
async function exportReportExcel(m, rangeLabel, orders, expenses, expenseTotal, netSales, eod, options={} ){
  if(typeof ExcelJS==='undefined'){ toast('Excel export library is not loaded.'); return null; }
  const download = options.download !== false;
  try{
    const wb = new ExcelJS.Workbook();
    wb.creator = 'Hibi Cafe POS';
    wb.created = new Date();
    const ws = wb.addWorksheet('Daily Report');
    ws.views = [{showGridLines:false}];

    const brown = '6F4E37';
    const headerFill = 'EDEDED';
    const lightFill = 'FAFAFA';
    const summaryFill = 'F4F4F4';
    const white = 'FFFFFF';
    const thin = {style:'thin', color:{argb:'FFD9D9D9'}};
    const moneyFmt = '₱#,##0.00';

    ws.mergeCells('A1:G1');
    ws.getCell('A1').value = 'Hibi Cafe - Daily Report';
    ws.getCell('A1').font = {size:15, bold:true, color:{argb:white}};
    ws.getCell('A1').fill = {type:'pattern', pattern:'solid', fgColor:{argb:brown}};
    ws.getCell('A1').alignment = {vertical:'middle'};
    ws.getRow(1).height = 24;
    ws.getCell('A2').value = 'Date';
    ws.getCell('A2').font = {bold:true};
    ws.getCell('B2').value = (reportsFilter.mode==='date' ? reportsFilter.date : todayStr());
    ws.getCell('D2').value = 'Period';
    ws.getCell('D2').font = {bold:true};
    ws.getCell('E2').value = rangeLabel;

    ws.getCell('A4').value = 'SUMMARY';
    ws.getCell('A4').font = {bold:true};
    const summary = [
      ['Sales before refunds', m.grossSales],
      ['Refunds', m.refundTotal],
      ['Net Sales', m.totalSales],
      ['Estimated Grab Fees', m.estimatedFees],
      ['Owner / Operational Expenses', m.opex||0],
      ['Estimated Balance after expenses', netSales],
      ['Cash Sales', m.pmAgg['Cash']?.sales || 0],
      ['GCash Sales', m.pmAgg['GCash']?.sales || 0],
      ['GrabFood Sales', m.pmAgg['GrabFood']?.sales || 0],
      ['Number of Cups', m.cups],
      ['Starting Cash', eod?.opening ?? ''],
      ['Expenses', expenseTotal],
      ['Actual Cash Counted', eod?.actual ?? ''],
      ['Expected Cash', eod?.expected ?? ((eod?.opening!=null) ? (eod.opening + (m.pmAgg['Cash']?.sales||0) + (eod.cashIn||0) - (eod.cashOut||0) - expenseTotal) : '')],
      ['Cash Variance', eod?.variance ?? ((eod?.actual!=null && eod?.opening!=null) ? (eod.actual - (eod.opening + (m.pmAgg['Cash']?.sales||0) + (eod.cashIn||0) - (eod.cashOut||0) - expenseTotal)) : '')]
    ];
    summary.forEach((item,i)=>{
      const row=5+i;
      ws.getCell(row,1).value=item[0];
      ws.getCell(row,2).value=item[1];
      ws.getCell(row,2).numFmt = item[0]==='Number of Cups' ? '0' : moneyFmt;
      if(item[0]==='Net Sales' || item[0]==='Cash Variance'){
        ws.getCell(row,1).font={bold:true}; ws.getCell(row,2).font={bold:true};
        ws.getCell(row,1).fill={type:'pattern',pattern:'solid',fgColor:{argb:summaryFill}};
        ws.getCell(row,2).fill={type:'pattern',pattern:'solid',fgColor:{argb:summaryFill}};
      }
    });

    const orderStart = 7 + summary.length;
    ws.mergeCells(orderStart, 1, orderStart, 7);
    ws.getCell(orderStart,1).value='ORDERS';
    ws.getCell(orderStart,1).font={bold:true};
    const orderHeaders=['Order #','Time','Channel','Payment','Cashier','Items','Total'];
    orderHeaders.forEach((h,c)=>{
      const cell=ws.getCell(orderStart+1,c+1); cell.value=h; cell.font={bold:true}; cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:headerFill}}; cell.border={bottom:thin};
    });
    let r=orderStart+2;
    orders.forEach((o,idx)=>{
      const itemsText=(o.items||[]).map(i=>{
        let text=i.name || i.product || 'Item';
        if(i.size) text += ` (${i.size})`;
        text += ` x${i.qty}`;
        return text;
      }).join('\n');
      const vals=[o.orderNumber,o.time,o.source,o.paymentMethod,o.cashier,(p1IsCancelled(o)?'Cancelled':(o.paymentStatus||o.status))+'\n'+itemsText,p1IsCancelled(o)?0:(o.total||0)];
      vals.forEach((v,c)=>{
        const cell=ws.getCell(r,c+1); cell.value=v; cell.border={bottom:thin}; cell.alignment={vertical:'top',wrapText:c===5};
        if(idx%2===1) cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:lightFill}};
      });
      ws.getCell(r,7).numFmt=moneyFmt;
      ws.getRow(r).height=Math.max(24,18*(o.items||[]).length);
      r++;
    });
    ws.getCell(r+1,6).value='SALES BEFORE REFUNDS'; ws.getCell(r+1,6).font={bold:true};
    ws.getCell(r+1,7).value=m.grossSales; ws.getCell(r+1,7).font={bold:true}; ws.getCell(r+1,7).numFmt=moneyFmt;

    const expStart=r+4;
    ws.mergeCells(expStart,1,expStart,7);
    ws.getCell(expStart,1).value='EXPENSES'; ws.getCell(expStart,1).font={bold:true};
    ['Time','Expense','Amount','Cashier'].forEach((h,c)=>{
      const cell=ws.getCell(expStart+1,c+1); cell.value=h; cell.font={bold:true}; cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:headerFill}}; cell.border={bottom:thin};
    });
    let er=expStart+2;
    (expenses||[]).forEach(x=>{
      [x.time,x.note,x.amount,x.cashier].forEach((v,c)=>{ const cell=ws.getCell(er,c+1); cell.value=v; cell.border={bottom:thin}; });
      ws.getCell(er,3).numFmt=moneyFmt; er++;
    });
    ws.getCell(er,2).value='TOTAL EXPENSES'; ws.getCell(er,2).font={bold:true};
    ws.getCell(er,3).value=expenseTotal; ws.getCell(er,3).font={bold:true}; ws.getCell(er,3).numFmt=moneyFmt;

    [14,11,16,14,14,50,17].forEach((w,i)=>ws.getColumn(i+1).width=w);
    ws.freezePanes='A19';
    ws.autoFilter={from:{row:orderStart+1,column:1},to:{row:Math.max(orderStart+1,r-1),column:7}};

    const refundSheet=wb.addWorksheet('Refunds');
    refundSheet.addRow(['Date','Order','Action','Amount','Cash','GCash','GrabFood','Preparation Started','Reason','Approved By']);
    (m.refunds||[]).forEach(x=>refundSheet.addRow([x.business_date,x.order?.order_code||x.order_id,x.kind,Number(x.amount),Number(x.cash_amount),Number(x.gcash_amount),Number(x.grab_amount),x.prepared?'Yes':'No',x.reason,x.approved_by_name]));
    refundSheet.getRow(1).font={bold:true};for(let i=1;i<=10;i++)refundSheet.getColumn(i).width=i===9?40:20;
    [4,5,6,7].forEach(i=>refundSheet.getColumn(i).numFmt=moneyFmt);
    const ownerSheet=wb.addWorksheet('Owner Expenses');ownerSheet.addRow(['Date','Category','Description','Payment','Amount']);
    OWNER_EXPENSES.filter(x=>x.date>=m.reportStart&&x.date<=m.reportEnd&&x.status!=='Voided').forEach(x=>ownerSheet.addRow([x.date,x.category,x.description,x.paymentMethod,x.amount]));
    for(let i=1;i<=5;i++)ownerSheet.getColumn(i).width=24;ownerSheet.getRow(1).font={bold:true};ownerSheet.getColumn(5).numFmt=moneyFmt;
    const filename = `${m.reportStart||excelSafeFilenameDate()}-HibiReport.xlsx`;
    const buffer = await wb.xlsx.writeBuffer();
    const bytes = new Uint8Array(buffer);
    let binary = '';
    const chunkSize = 0x8000;
    for(let i=0;i<bytes.length;i+=chunkSize){ binary += String.fromCharCode(...bytes.subarray(i, Math.min(i+chunkSize, bytes.length))); }
    const base64 = btoa(binary);

    if(download){
      const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      toast('Excel report exported: '+filename);
    }
    return {filename, content:base64};
  }catch(e){
    console.error(e);
    if(download) toast('Could not export Excel: '+(e.message||e));
    throw e;
  }
}

async function sendDailyReportEmail(report, attachment){
  const endpoint = `${SUPABASE_URL}/functions/v1/resend-email`;
  let accessToken = CURRENT_USER?.access_token || '';
  if(supabaseClient?.auth?.getSession){
    try{
      const {data} = await supabaseClient.auth.getSession();
      accessToken = data?.session?.access_token || accessToken;
    }catch(e){ console.warn('Could not refresh Supabase session for daily report email:', e); }
  }
  if(!accessToken) throw new Error('You are not logged in. Please log in again before sending the daily report.');
  const headers = {'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${accessToken}`};
  const res = await fetch(endpoint, {method:'POST',headers,body:JSON.stringify({report, attachment})});
  if(!res.ok){
    const text = await res.text();
    throw new Error(`Email report failed (${res.status}): ${text}`);
  }
  return await res.json().catch(()=>({ok:true}));
}

async function optimizeProductImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('Could not read image'));
    reader.onload=ev=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('Invalid image'));
      img.onload=()=>{
        const maxSide=900;
        const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
        const w=Math.max(1,Math.round(img.naturalWidth*scale));
        const h=Math.max(1,Math.round(img.naturalHeight*scale));
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
        // WebP keeps the menu database small; browsers that cannot encode it fall back to JPEG.
        let data=canvas.toDataURL('image/webp',0.72);
        if(!data.startsWith('data:image/webp')) data=canvas.toDataURL('image/jpeg',0.78);
        resolve(data);
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

      <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-save">Save Add-on</button>
    </div>`);
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-save').onclick = async ()=>{
    const n = document.getElementById('f-aname').value.trim();
    const p = parseFloat(document.getElementById('f-aprice').value)||0;
    const gp = parseFloat(document.getElementById('f-agrabprice').value)||p;
    if(!n) return;
    const reason=requireActionReason(`${isNew?'creating':'editing'} add-on ${n}`); if(!reason)return;
    const id=isNew?uid():a.id;
    if(isNew) ADDONS.push({id, name:n, price:p, grabPrice:gp, active:true});
    else { a.name=n; a.price=p; a.grabPrice=gp; }
    await persistAddons();
    await writeAudit(isNew?'create_addon':'edit_addon','addon',id,reason,{name:n,price:p,grabPrice:gp});
    closeModal();
    renderMenuMgmt();
    toast('Add-on saved');
  };
}

async function renderAuditLog(){
  const el=document.getElementById('audit-content');
  if(!isSuperuser()){ el.innerHTML='<div class="empty-state">Superuser access required.</div>'; return; }
  el.innerHTML=`<div class="page-title"><div><h1>Audit Log</h1><div class="psub">Record of logins, orders, status changes, expenses, cash movements, reconciliation, unlocks and system actions</div></div><button class="btn btn-secondary" id="audit-refresh">↻ Refresh</button></div>
    <div class="filter-bar" style="align-items:flex-end;">
      <div class="field" style="margin:0;min-width:140px;"><label>From</label><input type="date" id="audit-from"></div>
      <div class="field" style="margin:0;min-width:140px;"><label>To</label><input type="date" id="audit-to"></div>
      <div class="field" style="margin:0;min-width:150px;"><label>User</label><input type="text" id="audit-user" placeholder="username"></div>
      <div class="field" style="margin:0;min-width:170px;"><label>Action</label><select id="audit-action"><option value="">All actions</option></select></div>
      <div class="field" style="margin:0;min-width:150px;"><label>Entity</label><select id="audit-entity"><option value="">All entities</option></select></div>
      <div class="field" style="margin:0;min-width:220px;flex:1;"><label>Search</label><input type="search" id="audit-search" placeholder="Search reason or details…"></div>
      <button class="btn btn-secondary" id="audit-clear" type="button">Clear</button>
    </div>
    <div class="card" style="overflow-x:auto;"><table><thead><tr><th>Date / Time</th><th>User</th><th>Action</th><th>Entity</th><th>Reason</th><th>Details</th></tr></thead><tbody id="audit-rows"><tr><td colspan="6"><div class="empty-state">Loading…</div></td></tr></tbody></table></div>`;
  const renderRows=(rows)=>{
    const from=document.getElementById('audit-from').value;
    const to=document.getElementById('audit-to').value;
    const user=document.getElementById('audit-user').value.trim().toLowerCase();
    const action=document.getElementById('audit-action').value;
    const entity=document.getElementById('audit-entity').value;
    const search=document.getElementById('audit-search').value.trim().toLowerCase();
    const filtered=rows.filter(x=>{
      const dt=new Date(x.created_at); const localDate=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Manila',year:'numeric',month:'2-digit',day:'2-digit'}).format(dt);
      if(from && localDate<from) return false; if(to && localDate>to) return false;
      if(user && !(x.username||'').toLowerCase().includes(user)) return false;
      if(action && x.action!==action) return false;
      if(entity && (x.entity_type||'')!==entity) return false;
      if(search){ const hay=((x.reason||'')+' '+(typeof x.details==='string'?x.details:JSON.stringify(x.details||{}))).toLowerCase(); if(!hay.includes(search)) return false; }
      return true;
    });
    document.getElementById('audit-rows').innerHTML=filtered.length?filtered.map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString('en-PH',{timeZone:'Asia/Manila'}))}</td><td>${esc(x.username||'')}</td><td><b>${esc(x.action||'')}</b></td><td>${esc((x.entity_type||'')+(x.entity_id?': '+x.entity_id:''))}</td><td>${esc(x.reason||'')}</td><td><code style="font-size:11px;white-space:pre-wrap;">${esc(typeof x.details==='string'?x.details:JSON.stringify(x.details||{}))}</code></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty-state">No audit entries match these filters.</div></td></tr>`;
  };
  try{
    const rows=await posGetAll('/rest/v1/audit_logs?select=*&order=created_at.desc,id.desc');
    const actions=[...new Set(rows.map(x=>x.action).filter(Boolean))].sort();
    const entities=[...new Set(rows.map(x=>x.entity_type).filter(Boolean))].sort();
    document.getElementById('audit-action').innerHTML='<option value="">All actions</option>'+actions.map(x=>`<option value="${escAttr(x)}">${esc(x)}</option>`).join('');
    document.getElementById('audit-entity').innerHTML='<option value="">All entities</option>'+entities.map(x=>`<option value="${escAttr(x)}">${esc(x)}</option>`).join('');
    ['audit-from','audit-to','audit-user','audit-action','audit-entity','audit-search'].forEach(id=>document.getElementById(id).addEventListener(id==='audit-search'?'input':'change',()=>renderRows(rows)));
    document.getElementById('audit-clear').onclick=()=>{['audit-from','audit-to','audit-user','audit-search'].forEach(id=>document.getElementById(id).value='');document.getElementById('audit-action').value='';document.getElementById('audit-entity').value='';renderRows(rows);};
    document.getElementById('audit-refresh').onclick=renderAuditLog;
    renderRows(rows);
  }catch(e){ console.error(e); document.getElementById('audit-rows').innerHTML=`<tr><td colspan="6"><div class="empty-state">Could not load audit log.</div></td></tr>`; }
}

async function wireUserManagement(){
  const headers={apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${CURRENT_USER.access_token}`,'Content-Type':'application/json'};
  const list=document.getElementById('users-list');
  const form={authId:document.getElementById('u-auth-id'),username:document.getElementById('u-username'),display:document.getElementById('u-display'),password:document.getElementById('u-password'),passwordWrap:document.getElementById('u-password-wrap'),role:document.getElementById('u-role'),active:document.getElementById('u-active'),save:document.getElementById('u-save'),cancel:document.getElementById('u-cancel'),resetWrap:document.getElementById('u-reset-wrap'),resetPassword:document.getElementById('u-reset-password'),resetConfirm:document.getElementById('u-reset-confirm'),resetButton:document.getElementById('u-reset-password-btn')};
  let editingId='';
  const resetForm=()=>{
    editingId=''; form.authId.value=''; form.username.value=''; form.display.value=''; form.password.value=''; form.role.value='user'; form.active.value='true';
    document.querySelectorAll('#perm-grid [data-perm]').forEach(x=>x.checked=STAFF_PERMISSIONS.has(x.dataset.perm));
    form.save.textContent='Create User'; form.cancel.style.display='none'; form.passwordWrap.style.display='block';
    document.getElementById('u-edit-password-note').style.display='none';
    form.resetWrap.style.display='none'; form.resetPassword.value=''; form.resetConfirm.value='';
  };
  const renderUsers=async()=>{
    try{
      const r=await fetch(`${SUPABASE_URL}/rest/v1/user_profiles?select=auth_user_id,username,display_name,role,active,permissions&order=username`,{headers});
      if(!r.ok) throw new Error(await r.text());
      const rows=await r.json();
      list.innerHTML=rows.map(u=>{
        const access=u.role==='superuser'?'All access':'Dashboard, POS, Orders, Expenses, Shifts, Daily Reports';
        return `<tr><td>${esc(u.username)}</td><td>${esc(u.display_name||'')}</td><td>${esc(u.role)}</td><td>${u.active?'Yes':'No'}</td><td><span style="font-size:11px;color:var(--text-dim);">${esc(access)}</span> <button class="icon-btn" type="button" data-edit-user="${escAttr(u.auth_user_id)}">Edit</button> <button class="icon-btn" type="button" data-reset-user="${escAttr(u.auth_user_id)}">Change Password</button></td></tr>`;
      }).join('')||'<tr><td colspan="5">No users yet.</td></tr>';
      list.querySelectorAll('[data-edit-user]').forEach(btn=>btn.onclick=()=>{
        const u=rows.find(x=>x.auth_user_id===btn.dataset.editUser); if(!u) return;
        editingId=u.auth_user_id; form.authId.value=u.auth_user_id; form.username.value=u.username||''; form.display.value=u.display_name||''; form.password.value=''; form.role.value=u.role||'user'; form.active.value=String(u.active!==false);
        document.querySelectorAll('#perm-grid [data-perm]').forEach(x=>x.checked=!!u.permissions?.[x.dataset.perm]);
        form.save.textContent='Update User'; form.cancel.style.display='inline-flex'; form.passwordWrap.style.display='none';
        document.getElementById('u-edit-password-note').style.display='block';
        form.resetWrap.style.display='block'; form.resetPassword.value=''; form.resetConfirm.value='';
        form.resetWrap.scrollIntoView({behavior:'smooth',block:'nearest'});
        document.getElementById('u-username').focus();
      });
      list.querySelectorAll('[data-reset-user]').forEach(btn=>btn.onclick=()=>{
        const u=rows.find(x=>x.auth_user_id===btn.dataset.resetUser); if(!u) return;
        editingId=u.auth_user_id; form.authId.value=u.auth_user_id; form.username.value=u.username||''; form.display.value=u.display_name||''; form.password.value=''; form.role.value=u.role||'user'; form.active.value=String(u.active!==false);
        document.querySelectorAll('#perm-grid [data-perm]').forEach(x=>x.checked=!!u.permissions?.[x.dataset.perm]);
        form.save.textContent='Update User'; form.cancel.style.display='inline-flex'; form.passwordWrap.style.display='none'; document.getElementById('u-edit-password-note').style.display='block'; form.resetWrap.style.display='block'; form.resetPassword.value=''; form.resetConfirm.value='';
        form.resetWrap.scrollIntoView({behavior:'smooth',block:'nearest'});
        form.resetPassword.focus();
      });
    }catch(e){ list.innerHTML='<tr><td colspan="5">Could not load users.</td></tr>'; console.error(e); }
  };
  form.cancel.onclick=resetForm;
  form.resetButton.onclick=async()=>{
    if(!editingId){toast('Select a user first.');return;}
    const np=form.resetPassword.value||'', cp=form.resetConfirm.value||'';
    if(np.length<6){toast('Password must be at least 6 characters.');return;}
    if(np!==cp){toast('Passwords do not match.');return;}
    const username=form.username.value.trim().toLowerCase();
    const reason=requireActionReason(`changing password for user ${username}`); if(!reason)return;
    try{
      const r=await fetch(`${SUPABASE_URL}/functions/v1/manage-users`,{method:'POST',headers:{...headers},body:JSON.stringify({action:'reset_password',target_user_id:editingId,password:np})});
      let data={}; try{data=await r.json();}catch(e){}
      if(!r.ok) throw new Error(data.error||`Request failed (${r.status})`);
      await writeAudit('admin_change_password','user',editingId,reason,{username});
      form.resetPassword.value=''; form.resetConfirm.value='';
      toast('Password changed successfully.');
    }catch(e){toast('Could not change password: '+(e.message||e));}
  };
  form.save.onclick=async()=>{
    let auth_user_id=form.authId.value.trim(), username=form.username.value.trim().toLowerCase(), display_name=form.display.value.trim(), role=form.role.value, password=form.password.value, active=form.active.value==='true';
    if(!username){toast('Username is required.');return;}
    const permissions={}; DEFAULT_PERMISSIONS.forEach(p=>permissions[p]=STAFF_PERMISSIONS.has(p));
    const reason=requireActionReason(`${editingId?'updating':'creating'} user ${username}`); if(!reason)return;
    if(!editingId && !auth_user_id){
      if(!password || password.length<6){toast('For a new user, enter a password of at least 6 characters.');return;}
      try{
        const rCreate=await fetch(`${SUPABASE_URL}/functions/v1/manage-users`,{method:'POST',headers:{...headers},body:JSON.stringify({action:'create_user',username,display_name,role,active,password,permissions})});
        let createData={}; try{createData=await rCreate.json();}catch(e){}
        if(!rCreate.ok) throw new Error(createData.error||`Request failed (${rCreate.status})`);
        auth_user_id=createData.auth_user_id;
        if(!auth_user_id) throw new Error('Supabase did not return the new user ID.');
      }catch(e){toast('Could not create Auth user: '+(e.message||e));return;}
    }
    if(editingId){
      const payload={username,display_name,role,active,permissions};
      const url=`${SUPABASE_URL}/rest/v1/user_profiles?auth_user_id=eq.${encodeURIComponent(editingId)}`;
      const r=await fetch(url,{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify(payload)});
      if(!r.ok){toast('Could not save user: '+await r.text());return;}
      await writeAudit('update_user','user',auth_user_id,reason,{username,display_name,role,active,permissions});
      toast('User access updated'); resetForm(); await renderUsers();
    } else {
      await writeAudit('create_user','user',auth_user_id,reason,{username,display_name,role,active,permissions});
      toast('User created successfully'); resetForm(); await renderUsers();
    }
  };
  resetForm();
  await renderUsers();
}

<script>
(async function boot(){

  if(!supabaseClient){ showLoginError('Supabase authentication is unavailable.'); return; }
  applyBranding();
  document.getElementById('login-btn').onclick=doLogin;
  document.querySelectorAll('[data-password-toggle]').forEach(btn=>btn.onclick=()=>{
    const input=document.getElementById(btn.dataset.passwordToggle); if(!input)return;
    input.type=input.type==='password'?'text':'password';
    btn.setAttribute('aria-label',input.type==='password'?'Show password':'Hide password');
  });
  document.getElementById('login-password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

  document.getElementById('logout-btn').onclick=doLogout;
  document.getElementById('db-status-chip').onclick=()=>checkDatabaseHealth({silent:false});
  supabaseClient.auth.onAuthStateChange((_event,session)=>{ if(session?.access_token&&CURRENT_USER){CURRENT_USER.access_token=session.access_token;} });
  const {data}=await supabaseClient.auth.getSession();
  if(data.session){ try{ CURRENT_USER=data.session.user; CURRENT_USER.access_token=data.session.access_token; await loadProfile(CURRENT_USER); await writeAudit('login_session_restore','session',CURRENT_USER.id,'',{username:CURRENT_PROFILE?.username||'',role:CURRENT_PROFILE?.role||''}); showApp(); await loadAll(); startDatabaseHealthMonitor(); applyBranding(); goToPage('dashboard'); renderPOS(); renderOrderNumPreview(); }catch(e){await doLogout();} }
})();
